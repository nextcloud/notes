version: 2
updates:
- package-ecosystem: composer
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  cooldown:
    default-days: 10
    exclude:
    - "nextcloud/*"
  ignore:
  - dependency-name: nextcloud/ocp
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 10
    exclude:
    - "@nextcloud/*"
  ignore:
  # 8.x requires Nextcloud 35, info.xml min-version is 33
  - dependency-name: "@nextcloud/dialogs"
    versions: [">=8"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 10
