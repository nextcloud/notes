name: Update nextcloud/ocp

on:
  workflow_dispatch:
  schedule:
    - cron: '5 22 * * 6'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update-nextcloud-ocp:
    runs-on: ubuntu-latest

    # Only allowed to be run on nextcloud repositories
    if: ${{ github.repository_owner == 'nextcloud' }}

    env:
      # env variable for maintainers: 'false' disables auto-merge for these pull requests
      AUTOMERGE: true

    strategy:
      fail-fast: false
      matrix:
        branches:
          - ${{ github.event.repository.default_branch }}

    name: update-nextcloud-ocp-${{ matrix.branches }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.branches }}
          submodules: true

      - name: Get version matrix
        id: versions
        uses: nextcloud-libraries/nextcloud-version-matrix@71959de73c244b11ecbf4503b87c41d65b0f64ae # v1.3.4

      - name: Set up php${{ steps.versions.outputs.php-min }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ steps.versions.outputs.php-min }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read codeowners
        id: codeowners
        run: |
          grep '/appinfo/info.xml' .github/CODEOWNERS | cut -f 2- -d ' ' | xargs | awk '{ print "codeowners="$0 }' >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Check composer bin for nextcloud/ocp exists
        id: check_composer_bin
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          files: vendor-bin/nextcloud-ocp/composer.json

      - name: Composer update nextcloud/ocp
        id: update_branch
        env:
          USE_COMPOSER_BIN: ${{ steps.check_composer_bin.outputs.files_exists }}
          BRANCH_NAME: ${{ steps.versions.outputs.branches-min }}
        run: |
          COMPOSER_CMD='composer'
          if [[ "$USE_COMPOSER_BIN" == 'true' ]]; then
            COMPOSER_CMD='composer bin nextcloud-ocp'
          fi

          echo $COMPOSER_CMD require --dev nextcloud/ocp:dev-$BRANCH_NAME
          $COMPOSER_CMD require --dev nextcloud/ocp:dev-$BRANCH_NAME

      - name: Raise on issue on failure
        uses: dacbd/create-issue-action@cdb57ab6ff8862aa09fee2be6ba77a59581921c2 # v2.0.0
        if: ${{ failure() && steps.update_branch.conclusion == 'failure' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Failed to update nextcloud/ocp package'
          body: 'Please check the output of the GitHub action and manually resolve the issues<br>${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}<br>${{ steps.codeowners.outputs.codeowners }}'

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.COMMAND_BOT_PAT }}
          commit-message: 'chore(dev-deps): Bump nextcloud/ocp package'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          branch: 'automated/noid/${{ matrix.branches }}-update-nextcloud-ocp'
          title: '[${{ matrix.branches }}] Update nextcloud/ocp dependency'
          add-paths: ${{ steps.check_composer_bin.outputs.files_exists == 'true' && 'vendor-bin/nextcloud-ocp/composer.json,vendor-bin/nextcloud-ocp/composer.lock' || 'composer.json,composer.lock' }}
          body: |
            Auto-generated update of [nextcloud/ocp](https://github.com/nextcloud-deps/ocp/) dependency
          labels: |
            dependencies
            3. to review

      # Approve using the default GITHUB_TOKEN, as the PR itself was created
      # using COMMAND_BOT_PAT and GitHub does not allow an account to approve its own PR
      - name: GitHub actions bot approve
        if: steps.create-pull-request.outputs.pull-request-operation != 'none'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto merge
        if: steps.create-pull-request.outputs.pull-request-operation != 'none' && fromJSON(env.AUTOMERGE)
        uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d # v3.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
